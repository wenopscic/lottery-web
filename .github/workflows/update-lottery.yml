# ===========================================================================
# GitHub Actions：定時抓取彩票開獎號碼並更新快照
# 檔案位置：.github/workflows/update-lottery.yml
# ===========================================================================
#
# 【台北時間 ↔ UTC 換算說明】
#   GitHub Actions 的 cron 一律使用 UTC 時區，且「不」支援時區設定。
#   台北時間（Asia/Taipei）= UTC + 8 小時。
#   因此：台北時間 21:29 = UTC 13:29；台北 22:59 = UTC 14:59。
#
# 【本檔排程】方案 A：每天台北時間 21:29 起，連續每 9 分鐘一次，直到 22:59
#   -> UTC 13:29 起，連續每 9 分鐘一次，直到 14:59
#   共 11 次觸發，中間無空窗。
#
#   ⚠️ 為什麼要拆成兩條 cron？
#     cron 的「每 N 分鐘」寫法（如 */9）是從「每小時的第 0 分」開始算，
#     無法指定「從 29 分起跳、連續每 9 分鐘」。
#     因此必須用「明確列舉分鐘數」，並針對跨到的每個 UTC 小時分別處理，
#     才能確保每個小時的觸發分鐘正確、不重複、不遺漏。
#
#   【完整觸發時間對照表】
#     UTC 13 點（台北 21 點）：分鐘 29,38,47,56
#        台北 21:29 = UTC 13:29
#        台北 21:38 = UTC 13:38
#        台北 21:47 = UTC 13:47
#        台北 21:56 = UTC 13:56
#     UTC 14 點（台北 22 點）：分鐘 05,14,23,32,41,50,59
#        台北 22:05 = UTC 14:05
#        台北 22:14 = UTC 14:14
#        台北 22:23 = UTC 14:23
#        台北 22:32 = UTC 14:32
#        台北 22:41 = UTC 14:41
#        台北 22:50 = UTC 14:50
#        台北 22:59 = UTC 14:59   ← 最後一次，不超過 23:00 ✅
#
#   【如何自行調整】
#     - 想改成每天台北 21:00～23:00 每小時一次（較省額度）：
#         cron: '0 13,14,15 * * *'   # UTC 13:00/14:00/15:00
#     - 想改成每 12 分鐘輪詢（台北 20:00–23:59）：
#         cron: '*/12 12-15 * * *'   # UTC 12:00–15:59
#     - 想改成每天台北 22:00 執行一次：
#         cron: '0 14 * * *'         # UTC 14:00 = 台北 22:00
#     ※ 若要把「每 N 分鐘、從第 M 分起跳」跨多個小時，
#       記得把每小時對應的分鐘數「各自列舉」到不同的 cron。
#
#   ⚠️ 注意：GitHub Actions 的排程在尖峰時段可能延遲數分鐘至數十分鐘，
#      這是 GitHub 平台的已知行為，非本專案問題。
#      另外，每 9 分鐘一次的排程會增加 Actions 執行次數：
#      公開 repo 免費不限額度；私有 repo 每月 2000 分鐘額度，請留意用量。
# ===========================================================================

name: Update Lottery Snapshot

on:
  schedule:
    # 台北 21:29 / 21:38 / 21:47 / 21:56（= UTC 13:29/38/47/56）
    - cron: '29,38,47,56 13 * * *'
    # 台北 22:05 / 22:14 / 22:23 / 22:32 / 22:41 / 22:50 / 22:59
    # （= UTC 14:05/14/23/32/41/50/59）← 最後一次台北 22:59，不超過 23:00
    - cron: '5,14,23,32,41,50,59 14 * * *'
  workflow_dispatch: {}   # 支援手動觸發（Actions 頁面按 Run workflow）

# 需要寫入權限才能把更新後的快照 commit 回 repo
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 1) 取出 repo 內容
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) 安裝 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3) 安裝相依套件（香港六合彩需要無頭瀏覽器）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      # 4) 執行抓取程式（--force 忽略窗口，確保排程觸發時一定抓取）
      - name: Run update.py
        run: python3 update.py --force

      # 5) 若有變更則自動 commit 並 push（讓 GitHub Pages 更新）
      - name: Commit and push snapshot
        run: |
          git config user.name  "lottery-bot"
          git config user.email "lottery-bot@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --quiet --cached; then
            echo "快照無變更，略過 commit。"
          else
            git commit -m "chore: update lottery snapshot [skip ci]"
            git push
          fi
